<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jam Kerja 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F7; --surface:#FFFFFF; --soft:#F4F6FC; --ink:#12162B; --muted:#626985; --line:#E1E5F1;
  --kerja:#4F46E5; --lembur:#F59E0B; --libur:#0FA597;
  --shadow:0 1px 2px rgba(18,22,43,.05),0 10px 30px rgba(18,22,43,.06);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0B0E1C; --surface:#141830; --soft:#1B2040; --ink:#EEF0FB; --muted:#9AA1C4; --line:#272C4D;
  --kerja:#8F88FF; --lembur:#FBBF24; --libur:#2DD4BF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.5;
  background-image:radial-gradient(900px 420px at 8% -8%,color-mix(in srgb,var(--kerja) 16%,transparent),transparent),
                   radial-gradient(700px 380px at 100% 0%,color-mix(in srgb,var(--lembur) 10%,transparent),transparent);
  background-repeat:no-repeat;
}
.wrap{max-width:1080px;margin:0 auto;padding:22px 16px 72px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--kerja);outline-offset:2px}

header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}
h1{margin:0;font-size:clamp(28px,5vw,42px);font-weight:800;letter-spacing:-.035em;line-height:1.1}
header p{margin:6px 0 0;color:var(--muted);font-size:14px}
.theme{flex:none;width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;box-shadow:var(--shadow)}
.theme svg{width:20px;height:20px}

.tabs{display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:16px;width:max-content;max-width:100%;overflow-x:auto;box-shadow:var(--shadow);margin-bottom:16px}
.tabs button{border:0;background:transparent;padding:8px 16px;border-radius:12px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:20px}
.panel+.panel,.panel+.insight,.insight+.panel{margin-top:16px}
.panel-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;margin-bottom:14px}
h2{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.k{--c:var(--kerja)} .l{--c:var(--lembur)} .b{--c:var(--libur)}

/* Ringkasan */
.strip{display:grid;grid-template-columns:1.5fr repeat(3,1fr);padding:0;overflow:hidden}
.strip>div{padding:20px 22px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.strip>div+div{border-left:1px solid var(--line)}
.strip .big .num{font-size:clamp(44px,7vw,68px);font-weight:800;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.strip .big .unit{color:var(--muted);font-size:14px;font-weight:500}
.strip .stat b{font-size:28px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.strip .stat span{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.insight{margin:14px 4px 0;color:var(--muted);font-size:14px}
.insight strong{color:var(--ink);font-weight:600}
.insight:empty{display:none}

/* Pita jam kerja */
.scroll{max-height:560px;overflow:auto;margin:0 -8px;padding:0 8px}
.axis,.row{display:grid;grid-template-columns:92px 1fr 62px;gap:12px;align-items:center}
.axis{position:sticky;top:0;z-index:2;background:var(--surface);padding:2px 0 8px;font-size:11.5px;color:var(--muted)}
.scale{position:relative;height:16px}
.scale span{position:absolute;top:0;transform:translateX(-50%);font-variant-numeric:tabular-nums}
.axis .ot-h{text-align:right}
.row{height:28px;font-size:13px;border-radius:10px}
.row:hover{background:var(--soft)}
.row .lbl{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.track{position:relative;height:14px;border-right:1px solid var(--line);background:linear-gradient(to right,var(--line) 1px,transparent 1px) 0 0/20% 100% repeat-x}
.bar{position:absolute;top:0;bottom:0;border-radius:7px;overflow:hidden;background:color-mix(in srgb,var(--c) 30%,transparent)}
.bar i{position:absolute;right:0;top:0;bottom:0;background:var(--c)}
.rest{position:absolute;left:6px;top:-3px;font-size:11px;font-weight:600;color:var(--libur);border:1px dashed color-mix(in srgb,var(--libur) 60%,transparent);border-radius:999px;padding:0 8px;line-height:18px;background:var(--surface)}
.row .ot{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.row .ot.zero{color:var(--muted);font-weight:400}

/* Grafik */
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:inherit;fill:var(--muted);font-size:11px}
.chart .val{fill:var(--ink);font-weight:700;font-size:12px}
.note{margin:10px 0 0;font-size:12px;color:var(--muted)}

/* Tabel */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 14px;font-size:13px;font-weight:600;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.tablewrap{overflow:auto;max-height:520px;margin:0 -8px;padding:0 8px}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:10px 10px;text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--surface);font-size:12.5px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line)}
th button{border:0;background:none;padding:0;font-weight:600;color:var(--muted);display:inline-flex;gap:4px;align-items:center}
td{border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.wk td{padding:6px 0 10px;border-bottom:0}
.wkbar.wl{border-radius:12px 0 0 12px;padding-right:0}
.wkbar.mid{border-radius:0;padding-left:0;padding-right:0}
.wkbar.mid.val{padding-right:10px}
.wkbar.mid span{justify-content:flex-end}
.wkbar.wr{border-radius:0 12px 12px 0;padding-left:0}
.wkbar.wr span{justify-content:flex-end}
.wkbar{display:flex;flex-direction:column;gap:3px;background:var(--soft);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--muted)}
.wkbar span{display:flex;justify-content:space-between;gap:16px}
.wkbar b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.wkbar .wt{color:var(--ink);font-weight:600;border-top:1px solid var(--line);padding-top:4px;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px}
.empty{padding:28px;text-align:center;color:var(--muted)}
footer{margin:22px 4px 0;font-size:11px;text-align:center;color:var(--muted)}

@media (max-width:820px){
  .strip{grid-template-columns:repeat(3,1fr)}
  .strip .big{grid-column:1/-1;border-bottom:1px solid var(--line)}
  .strip .big+.stat{border-left:0}
  .strip>div{padding:16px 18px}
}
@media (max-width:560px){
  .panel{padding:16px;border-radius:20px}
  .axis,.row{grid-template-columns:78px 1fr 48px;gap:8px}
  .hide-s{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>ABSENSI</h1>
      <p id="range"></p>
    </div>
    <button class="theme" id="theme" aria-label="Ganti tema terang atau gelap" title="Ganti tema"></button>
  </header>

  <nav class="tabs" id="tabs" aria-label="Pilih periode"></nav>

  <section class="panel strip" id="strip" aria-label="Ringkasan"></section>
  <p class="insight" id="insight"></p>

  <section class="panel" aria-labelledby="h-ribbon">
    <div class="panel-head">
      <h2 id="h-ribbon">Jam masuk dan keluar per hari</h2>
      <div class="legend">
        <span><i class="dot k"></i>Kerja</span>
        <span><i class="dot l"></i>Lembur</span>
        <span><i class="dot b"></i>Libur</span>
        <span>Bagian pekat: jam overtime</span>
      </div>
    </div>
    <div class="scroll" id="ribbon" tabindex="0" aria-label="Daftar jam kerja per hari, dapat digulir"></div>
  </section>

  <section class="panel" aria-labelledby="h-chart">
    <div class="panel-head">
      <h2 id="h-chart">Overtime</h2>
      <div class="legend" id="chart-legend"></div>
    </div>
    <div class="chart" id="chart"></div>
    <p class="note" id="chart-note"></p>
  </section>

  <section class="panel" aria-labelledby="h-table">
    <div class="panel-head">
      <h2 id="h-table">Rincian absensi</h2>
      <div class="chips" id="chips" role="group" aria-label="Filter status"></div>
    </div>
    <div class="tablewrap" id="table"></div>
  </section>

  <footer>Created by Surki</footer>
</div>

const ST = {K:'Kerja', L:'Lembur', B:'Libur'};
const CL = {K:'k', L:'l', B:'b'};
const MON = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const MS = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const AX0 = 240, AX1 = 1440; // 04:00 sampai 24:00

const toMin = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
const mk = (d,s,i,o,ot) => {
  const [y,m,dd] = d.split('-').map(Number);
  let a = null, b = null;
  if (i) { a = toMin(i); b = toMin(o); if (b <= a) b += 1440; }
  return {d,y,m,dd,date:new Date(y,m-1,dd),s,i,o,a,b,ot:+ot};
};
const byDate = (x,y) => x.d < y.d ? -1 : 1;
let rows = RAW.trim().split('\n').map(line => mk(...line.trim().split(','))).sort(byDate);

let months = [...new Set(rows.map(r => r.m))];
const fmt = n => n.toLocaleString('id-ID',{maximumFractionDigits:1});
const wdShort = r => r.date.toLocaleDateString('id-ID',{weekday:'short'});
const wdLong = r => r.date.toLocaleDateString('id-ID',{weekday:'long'});
const lbl = r => `${wdShort(r)}, ${r.dd} ${MS[r.m-1]}`;
const sum = rs => rs.reduce((t,r) => t + r.ot, 0);
const cnt = (rs,s) => rs.filter(r => r.s === s).length;
const $ = s => document.querySelector(s);

const _now = new Date();
const _cur = rows.find(r => r.y === _now.getFullYear() && r.m === _now.getMonth()+1);
const state = {m:(_cur || rows[rows.length-1]).m, f:'all', desc:false};
const scope = () => state.m === 'all' ? rows : rows.filter(r => r.m === state.m);

function renderHead(){
  const f = rows[0], l = rows[rows.length-1];
  $('#range').textContent = 'Mr. Takuya Yokohama - Surki';
  $('#tabs').innerHTML = months.map(m => [m, MS[m-1]])
    .map(([v,t]) => `<button data-m="${v}" aria-pressed="${state.m===v}">${t}</button>`).join('');
}

function renderStrip(){
  const rs = scope(), total = sum(rs);
  const kerja = cnt(rs,'K'), lembur = cnt(rs,'L'), libur = cnt(rs,'B');
  const aktif = kerja + lembur;
  $('#strip').innerHTML = `
    <div class="big"><span class="num">${fmt(total)}</span><span class="unit">jam overtime ${state.m==='all'?'sepanjang periode':'di '+MON[state.m-1]}</span></div>
    <div class="stat"><b>${kerja}</b><span><i class="dot k"></i>Hari kerja</span></div>
    <div class="stat"><b>${lembur}</b><span><i class="dot l"></i>Hari lembur</span></div>
    <div class="stat"><b>${libur}</b><span><i class="dot b"></i>Hari libur</span></div>`;

  const top = rs.reduce((a,r) => r.ot > a.ot ? r : a, rs[0]);
  let text = '';
  if (state.m === 'all') {
    const per = months.map(m => [m, sum(rows.filter(r => r.m === m))]);
    const best = per.reduce((a,p) => p[1] > a[1] ? p : a, per[0]);
    text += `Overtime terbanyak ada di <strong>${MON[best[0]-1]}</strong> (${fmt(best[1])} jam). `;
  }
  $('#insight').innerHTML = text;
}

function renderRibbon(){
  const rs = scope(), span = AX1 - AX0;
  const ticks = [4,8,12,16,20,24];
  const scale = ticks.map((h,i) => {
    const left = (h*60-AX0)/span*100;
    const tf = i === 0 ? 'translateX(0)' : i === ticks.length-1 ? 'translateX(-100%)' : 'translateX(-50%)';
    return `<span style="left:${left}%;transform:${tf}">${String(h).padStart(2,'0')}:00</span>`;
  }).join('');
  const head = `<div class="axis"><span>Tanggal</span><div class="scale">${scale}</div><span class="ot-h">OT</span></div>`;
  const body = rs.map(r => {
    if (r.s === 'B') {
      return `<div class="row"><span class="lbl">${lbl(r)}</span><div class="track"><span class="rest">Libur</span></div><span class="ot zero">–</span></div>`;
    }
    const left = (r.a-AX0)/span*100, width = (r.b-r.a)/span*100;
    const otw = Math.min(100, r.ot*60/(r.b-r.a)*100);
    const tip = `${lbl(r)}: ${r.i} sampai ${r.o}, overtime ${fmt(r.ot)} jam (${ST[r.s]})`;
    return `<div class="row" title="${tip}"><span class="lbl">${lbl(r)}</span>
      <div class="track"><div class="bar ${CL[r.s]}" style="left:${left}%;width:${width}%"><i style="width:${otw}%"></i></div></div>
      <span class="ot ${r.ot===0?'zero':''}">${r.ot===0?'0':'+'+fmt(r.ot)}</span></div>`;
  }).join('');
  $('#ribbon').innerHTML = head + body;
}

function niceMax(v){
  for (const s of [1,2,2.5,5,10,20,25,50,100,200]) { const n = Math.ceil(v/s); if (n <= 5) return {step:s, max:n*s}; }
  return {step:100, max:Math.ceil(v/100)*100};
}

function renderChart(){
  const all = state.m === 'all';
  let data;
  if (all) {
    data = months.map(m => {
      const rs = rows.filter(r => r.m === m);
      const last = rs[rs.length-1];
      const dim = new Date(last.y, m, 0).getDate();
      return {label: MS[m-1] + (last.dd < dim ? '*' : ''), v: sum(rs), cls:'k', partial:last.dd < dim, lastDay:last.dd};
    });
  } else {
    data = rows.filter(r => r.m === state.m).map(r => ({label:String(r.dd), v:r.ot, cls:CL[r.s], rest:r.s==='B', tip:`${lbl(r)}: ${fmt(r.ot)} jam`}));
  }
  const W = 640, H = 240, pl = 34, pr = 6, pt = 18, pb = 26;
  const {step,max} = niceMax(Math.max(...data.map(d => d.v), 1));
  const iw = W-pl-pr, ih = H-pt-pb, st = iw/data.length, bw = Math.min(56, st*0.62);
  const y = v => pt + ih*(1 - v/max);
  let g = '';
  for (let t = 0; t <= max+0.001; t += step) {
    g += `<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${pl-8}" y="${y(t)+4}" text-anchor="end">${fmt(t)}</text>`;
  }
  const bars = data.map((d,i) => {
    const x = pl + st*i + (st-bw)/2, h = Math.max(0, ih*d.v/max);
    const col = `var(--${d.cls==='k'?'kerja':d.cls==='l'?'lembur':'libur'})`;
    let s = '';
    if (d.v > 0) s += `<rect x="${x}" y="${y(d.v)}" width="${bw}" height="${h}" rx="${Math.min(8,bw/2)}" fill="${col}" ${d.partial?'fill-opacity=".55"':''}><title>${d.tip || d.label+': '+fmt(d.v)+' jam'}</title></rect>`;
    else if (!all) s += `<rect x="${x}" y="${y(0)-2}" width="${bw}" height="2" rx="1" fill="${d.rest?'var(--libur)':'var(--line)'}"/>`;
    if (all) s += `<text class="val" x="${x+bw/2}" y="${y(d.v)-7}" text-anchor="middle">${fmt(d.v)}</text>`;
    s += `<text x="${x+bw/2}" y="${H-8}" text-anchor="middle">${d.label}</text>`;
    return s;
  }).join('');
  $('#chart').innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik batang overtime ${all?'per bulan':'per hari di '+MON[state.m-1]}">${g}${bars}</svg>`;
  $('#chart-legend').innerHTML = all
    ? '<span>Total jam per bulan</span>'
    : '<span><i class="dot k"></i>Kerja</span><span><i class="dot l"></i>Lembur</span><span><i class="dot b"></i>Libur (garis teal)</span>';
  const part = all ? data.filter(d => d.partial) : [];
  $('#chart-note').textContent = part.length ? `* Bulan belum penuh, data sampai tanggal ${part[0].lastDay}.` : '';
}

function renderTable(){
  const chips = [['all','Semua'],['K','Kerja'],['L','Lembur'],['B','Libur']];
  $('#chips').innerHTML = chips.map(([v,t]) => `<button data-f="${v}" aria-pressed="${state.f===v}">${t}</button>`).join('');
  let rs = scope().filter(r => state.f === 'all' || r.s === state.f);
  rs = [...rs].sort((a,b) => state.desc ? (a.d < b.d ? 1 : -1) : (a.d < b.d ? -1 : 1));
  if (!rs.length) { $('#table').innerHTML = '<div class="empty">Tidak ada data untuk filter ini.</div>'; return; }
  const dur = r => r.a === null ? '–' : fmt((r.b-r.a)/60);
  const weekOf = r => {
    const mon = new Date(r.y, r.m-1, r.dd - (r.date.getDay()+6)%7);
    const sun = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate()+6);
    return {key: mon.getTime(), label: `${mon.getDate()} ${MS[mon.getMonth()]} – ${sun.getDate()} ${MS[sun.getMonth()]}`};
  };
  const weeks = {};
  rows.forEach(r => {
    const w = weekOf(r);
    const x = weeks[w.key] || (weeks[w.key] = {otKerja:0, otLibur:0, ot:0});
    if (r.s === 'K') x.otKerja += r.ot;
    else if (r.s === 'L') x.otLibur += r.ot;
    x.ot += r.ot;
  });
  // Akumulasi Total Overtime dihitung per periode bulan dan tahun yang dipilih
  const cumBy = {};
  let ck = 0, cl = 0, ct = 0;
  [...scope()].sort(byDate).forEach(r => {
    if (r.s === 'K') ck += r.ot; else if (r.s === 'L') cl += r.ot;
    ct += r.ot;
    cumBy[weekOf(r).key] = {cK:ck, cL:cl, cT:ct};
  });
  const rowsHtml = list => list.map((r,idx) => {
    let h = `<tr><td>${lbl(r)}</td>
      <td><span class="pill ${CL[r.s]}"><i class="dot"></i>${ST[r.s]}</span></td>
      <td>${r.i||'–'}</td><td>${r.o||'–'}</td><td class="num hide-s">${dur(r)}</td>
      <td class="num">${r.s==='B'?'–':fmt(r.ot)}</td><td></td></tr>`;
    const w = weekOf(r), nx = list[idx+1];
    if (!nx || weekOf(nx).key !== w.key) {
      const x = weeks[w.key];
      const blank = '<span>&nbsp;</span><span>&nbsp;</span><span class="wt">&nbsp;</span>';
      h += `<tr class="wk"><td colspan="4"><div class="wkbar wl"><span>OT kerja</span><span>OT libur</span><span class="wt">Total</span></div></td>
        <td class="hide-s"><div class="wkbar mid">${blank}</div></td>
        <td class="num"><div class="wkbar mid val"><span><b>${fmt(x.otKerja)}</b></span><span><b>${fmt(x.otLibur)}</b></span><span class="wt"><b>${fmt(x.ot)}</b></span></div></td>
        <td class="num"><div class="wkbar wr"><span><b>${fmt(cumBy[w.key].cK)}</b></span><span><b>${fmt(cumBy[w.key].cL)}</b></span><span class="wt"><b>${fmt(cumBy[w.key].cT)}</b></span></div></td></tr>`;
    }
    return h;
  }).join('');
  $('#table').innerHTML = `<table><thead><tr>
    <th><button id="sort" aria-label="Urutkan tanggal">Tanggal ${state.desc?'↓':'↑'}</button></th>
    <th>Status</th><th>Masuk</th><th>Keluar</th><th class="num hide-s">Durasi</th><th class="num">Overtime</th><th class="num">Total Overtime</th></tr></thead><tbody>
    ${rowsHtml(rs)}
    </tbody></table>`;
}

function renderAll(){ renderHead(); renderStrip(); renderRibbon(); renderChart(); renderTable(); }

document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.m !== undefined) { state.m = t.dataset.m === 'all' ? 'all' : +t.dataset.m; renderAll(); $('#ribbon').scrollTop = 0; }
  else if (t.dataset.f !== undefined) { state.f = t.dataset.f; renderTable(); }
  else if (t.id === 'sort') { state.desc = !state.desc; renderTable(); }
});

/* Tema */
const root = document.documentElement;
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function setTheme(t){ root.dataset.theme = t; $('#theme').innerHTML = t === 'dark' ? SUN : MOON; }
setTheme(matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
$('#theme').addEventListener('click', () => setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark'));

/* Sinkron otomatis dengan Google Sheets (sheet harus dibagikan "Siapa saja yang memiliki link: Pelihat") */
const SHEET_ID = '1FCLiAaL7SKgb4iIRH3fi6_g-Ipv-PE6SaIlb4TxqypQ';
const SHEET_NAME = '2026';
const REFRESH_MS = 60000;

function fetchSheet(){
  return new Promise((resolve, reject) => {
    const cb = '__gv' + Date.now();
    const s = document.createElement('script');
    const done = () => { clearTimeout(t); delete window[cb]; s.remove(); };
    const t = setTimeout(() => { done(); reject(new Error('timeout')); }, 15000);
    window[cb] = res => { done(); resolve(res); };
    s.onerror = () => { done(); reject(new Error('load')); };
    s.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${encodeURIComponent(SHEET_NAME)}&headers=1&tqx=${encodeURIComponent('out:json;responseHandler:' + cb)}&_=${Date.now()}`;
    document.head.appendChild(s);
  });
}

function parseSheet(res){
  if (!res || res.status !== 'ok' || !res.table) throw new Error('bad response');
  const out = [];
  for (const r of res.table.rows) {
    const c = r.c || [];
    const cell = i => c[i] || {};
    const txt = i => { const x = cell(i); const v = x.f != null ? x.f : x.v; return v == null ? '' : String(v).trim(); };
    let d = '';
    const dc = cell(1), dv = dc.v == null ? '' : String(dc.v).trim();
    let m;
    if ((m = dv.match(/^Date\((\d+),(\d+),(\d+)/))) d = `${m[1]}-${String(+m[2]+1).padStart(2,'0')}-${m[3].padStart(2,'0')}`;
    else if ((m = dv.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) d = `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
    else if ((m = dv.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/))) d = `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
    if (!d) continue;
    const st = txt(2).toLowerCase();
    const s = st === 'lembur' ? 'L' : st === 'libur' ? 'B' : st === 'kerja' ? 'K' : null;
    if (!s) continue;
    const tm = i => { const k = txt(i).match(/(\d{1,2}):(\d{2})/); return k ? k[1].padStart(2,'0') + ':' + k[2] : ''; };
    let a = tm(3), b = tm(4);
    if (s === 'B') { a = ''; b = ''; }
    else if (!a || !b) continue;
    const ov = cell(5);
    let ot = typeof ov.v === 'number' ? ov.v : parseFloat(String(ov.v == null ? '' : ov.v).replace(',', '.'));
    if (!isFinite(ot)) ot = 0;
    out.push(mk(d, s, a, b, ot));
  }
  return out.sort(byDate);
}

const sigOf = rs => JSON.stringify(rs.map(r => [r.d, r.s, r.i, r.o, r.ot]));
let _sig = sigOf(rows);

function refresh(){
  fetchSheet().then(parseSheet).then(rs => {
    if (!rs.length) return;
    const sg = sigOf(rs);
    if (sg === _sig) return;
    _sig = sg;
    rows = rs;
    months = [...new Set(rows.map(r => r.m))];
    if (!months.includes(state.m)) state.m = months[months.length-1];
    renderAll();
  }).catch(() => {});
}

renderAll();
refresh();
setInterval(refresh, REFRESH_MS);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
